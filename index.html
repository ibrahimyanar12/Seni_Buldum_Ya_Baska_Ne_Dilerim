<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birlikte Geçen Sonsuz Zamanımız ❤️</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Dancing+Script:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #0b0b0b;
        color: #fff;
        font-family: "Poppins", sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
      }

      /* Arka Plan Kalp Yağmuru */
      .hearts-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
      }

      .heart {
        position: absolute;
        background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff4d79"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>')
          no-repeat center;
        background-size: contain;
        opacity: 0.6;
        animation: fall linear infinite;
      }

      @keyframes fall {
        0% {
          transform: translateY(-10vh) scale(0.5);
          opacity: 0;
        }
        20% {
          opacity: 0.7;
        }
        100% {
          transform: translateY(110vh) scale(1.1);
          opacity: 0;
        }
      }

      /* Ana İçerik Kutusu */
      .card {
        position: relative;
        z-index: 2;
        background: rgba(20, 20, 20, 0.75);
        border: 1px solid rgba(255, 77, 121, 0.25);
        padding: 40px 30px;
        border-radius: 25px;
        backdrop-filter: blur(12px);
        max-width: 650px;
        width: 90%;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      }

      h1 {
        font-family: "Dancing Script", cursive;
        font-size: 2.8rem;
        color: #ff758c;
        margin-bottom: 10px;
        text-shadow: 0 0 15px rgba(255, 77, 121, 0.3);
      }

      .subtitle {
        font-size: 1rem;
        color: #ccc;
        margin-bottom: 30px;
      }

      /* Sayaç Kutuları */
      .countdown-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        margin-bottom: 30px;
      }

      .time-box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 77, 121, 0.2);
        padding: 15px 10px;
        border-radius: 15px;
      }

      .time-box span {
        display: block;
        font-size: 2rem;
        font-weight: 600;
        color: #ff758c;
        margin-bottom: 5px;
      }

      .time-box label {
        font-size: 0.85rem;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .footer-note {
        font-size: 1.1rem;
        color: #e0e0e0;
        font-style: italic;
      }

      /* Mobilde Grid Düzeni */
      @media (max-width: 600px) {
        .countdown-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <!-- Kalp Yağmuru Kapsayıcısı -->
    <div class="hearts-container" id="heartsContainer"></div>

    <div class="card">
      <h1>Birlikte Geçen Ömrümüz</h1>
      <p class="subtitle">27 Ekim 2024'ten beri kalplerimiz bir atıyor... ❤️</p>

      <div class="countdown-grid">
        <div class="time-box">
          <span id="days">0</span>
          <label>Gün</label>
        </div>
        <div class="time-box">
          <span id="hours">0</span>
          <label>Saat</label>
        </div>
        <div class="time-box">
          <span id="minutes">0</span>
          <label>Dakika</label>
        </div>
        <div class="time-box">
          <span id="seconds">0</span>
          <label>Saniye</label>
        </div>
      </div>

      <div class="footer-note">
        "İyi ki varsın, iyi ki benimlesin Beril'im..." ✨
      </div>
    </div>

    <script>
      // Başlangıç Tarihi: 27 Ekim 2024, Saat 00:00:00
      const startDate = new Date("2024-10-27T00:00:00");

      function updateCountdown() {
        const now = new Date();
        const diff = now - startDate; // milisaniye cinsinden fark

        if (diff > 0) {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor(
            (diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
          );
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);

          document.getElementById("days").innerText = days;
          document.getElementById("hours").innerText =
            hours < 10 ? "0" + hours : hours;
          document.getElementById("minutes").innerText =
            minutes < 10 ? "0" + minutes : minutes;
          document.getElementById("seconds").innerText =
            seconds < 10 ? "0" + seconds : seconds;
        }
      }

      // Her saniye sayacı güncelle
      setInterval(updateCountdown, 1000);
      updateCountdown(); // Sayfa açılır açılmaz hemen çalıştır

      // Arka Planda Kalp Üretme Efekti
      function createHeart() {
        const container = document.getElementById("heartsContainer");
        const heart = document.createElement("div");
        heart.classList.add("heart");

        const size = Math.random() * 20 + 10;
        heart.style.width = `${size}px`;
        heart.style.height = `${size}px`;
        heart.style.left = `${Math.random() * 100}vw`;

        const duration = Math.random() * 3 + 3;
        heart.style.animationDuration = `${duration}s`;

        container.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, duration * 1000);
      }

      setInterval(createHeart, 350);
    </script>
  </body>
</html>
